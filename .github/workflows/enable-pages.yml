name: Enable GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [arena/ecaefc9d-unit-converter]
    paths: ['.github/workflows/enable-pages.yml']
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages for this branch (repository root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f "source[branch]=${GITHUB_REF_NAME}" \
              -f "source[path]=/" \
              --jq '{status,html_url,source}'
          fi
